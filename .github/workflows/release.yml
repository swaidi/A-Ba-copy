name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download OCR models (fast English, high-accuracy Arabic)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fsSL -o app/src/main/assets/tessdata/eng.traineddata \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata"
          curl -fsSL -o app/src/main/assets/tessdata/ara.traineddata \
            "https://github.com/tesseract-ocr/tessdata_best/raw/main/ara.traineddata"
          ls -l app/src/main/assets/tessdata

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing; the APK will use a temporary debug key and Obtainium updates will fail."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Alef_B_scan-v1.0.${VERSION_CODE}.apk"

      - name: Keep APK as a build artifact (test builds)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Alef_B_scan v1.0.${{ github.run_number }}
          body: Automatic build from commit ${{ github.sha }}.
          files: dist/*.apk
